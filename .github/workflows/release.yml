name: Build and publish upstream APK

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-37"

      - name: Check tag matches app version
        shell: bash
        run: |
          app_version="$(sed -n 's/.*versionName = "\(.*\)"/\1/p' app/androidApp/build.gradle.kts | head -n 1)"
          test "$GITHUB_REF_NAME" = "v$app_version"

      - name: Decode release signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/fll-helper-release.jks"

      - name: Build signed APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/fll-helper-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew :app:androidApp:assembleUpstreamRelease

      - name: Name release APK
        run: cp app/androidApp/build/outputs/apk/upstream/release/*.apk fll-helper-app.apk

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: fll-helper-app.apk
          generate_release_notes: true
